<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Barber and Beyond Hair Studio - Eldoret</title>
<style>
body{max-width:420px;margin:auto;font-family:system-ui,sans-serif;padding:12px;background:#f9fafb}
.card{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;background:white;margin-bottom:14px}
.btn{background:#111827;color:white;padding:8px 14px;border-radius:20px;text-decoration:none;float:right;font-size:14px;font-weight:bold}
#install{position:fixed;bottom:12px;left:12px;right:12px;background:#111827;color:white;padding:15px;border-radius:12px;text-align:center;display:none;z-index:999;font-weight:bold}
</style>
</head>
<body>

<h2 style="margin-bottom:2px">Barber and Beyond Hair Studio</h2>
<p style="color:gray;margin-top:0;font-size:14px">Eldoret Town | Premium Grooming</p>

<a href="https://wa.me/254701771654?text=Hi%20Barber%20and%20Beyond,%20I%20want%20to%20book" style="background:#25D366;color:white;padding:14px;display:block;text-align:center;border-radius:10px;text-decoration:none;font-weight:bold;margin:12px 0">Book on WhatsApp</a>

<div id="list"></div>

<div style="text-align:center;padding:20px;color:gray;font-size:12px">Open Daily 8am - 10pm | Professional Cuts</div>
<footer style="text-align:center;padding:20px 10px;color:#64748b;font-size:12px;line-height:1.8"><strong>Powered by ELGON LABS</strong><div>Technology • Innovation • Digital Solutions</div></footer>
<div id="install" onclick="installApp()">Add to Home Screen</div>

<script>
const PRODUCTS = [
 {name:"Fade Haircut", price:70, image:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=500", desc:"Clean fade with styling"},
 {name:"Beard Trim", price:30, image:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=500", desc:"Shape and line up"},
 {name:"Haircut + Beard", price:70, image:"https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=500", desc:"Full grooming package"},
 {name:"Dreadlocks Retouch", price:500, image:"https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?w=500", desc:"Retwist and styling"},
 {name:"Kids Haircut", price:50, image:"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=500", desc:"Ages 3-12 years"}
];

document.getElementById('list').innerHTML = PRODUCTS.map(p=>`
<div class="card">
<img src="${p.image}" style="width:100%;height:240px;object-fit:cover">
<div style="padding:13px">
<b style="font-size:17px">${p.name}</b><br>
<span style="color:gray;font-size:13px">${p.desc}</span><br>
<div style="margin-top:8px">
<span style="font-weight:bold;font-size:16px">KES ${p.price}</span>
<a class="btn" href="https://wa.me/254701771654?text=I%20want%20${encodeURIComponent(p.name)}%20-%20KES%20${p.price}">Book Now</a>
<div style="clear:both"></div>
</div>
</div></div>`).join('');

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install').style.display = 'block'; });
function installApp(){ if(deferredPrompt){ deferredPrompt.prompt(); } else{ alert('Tap Chrome menu > Add to Home screen'); } document.getElementById('install').style.display='none'; }
setTimeout(()=>{ const el=document.getElementById('install'); if(el.style.display==='none') el.style.display='block'; setTimeout(()=>el.style.display='none',9000); },3000);
</script>
</body>
</html>
